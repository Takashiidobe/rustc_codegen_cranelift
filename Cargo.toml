[package]
name = "rustc_codegen_cranelift"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
# These have to be in sync with each other
cranelift-codegen = { git = "https://github.com/Takashiidobe/wasmtime.git", branch = "gbc-lr35902", default-features = false, features = ["std", "timing", "unwind", "all-native-arch", "lr35902"] }
cranelift-frontend = { git = "https://github.com/Takashiidobe/wasmtime.git", branch = "gbc-lr35902" }
cranelift-module = { git = "https://github.com/Takashiidobe/wasmtime.git", branch = "gbc-lr35902" }
cranelift-native = { git = "https://github.com/Takashiidobe/wasmtime.git", branch = "gbc-lr35902" }
cranelift-jit = { git = "https://github.com/Takashiidobe/wasmtime.git", branch = "gbc-lr35902", optional = true }
cranelift-object = { git = "https://github.com/Takashiidobe/wasmtime.git", branch = "gbc-lr35902", default-features = false }
target-lexicon = "0.13"
gimli = { version = "0.33", default-features = false, features = ["write"] }
object = { version = "0.40.0", default-features = false, features = ["std", "read_core", "write", "archive", "coff", "elf", "macho", "pe"] }

indexmap = "2.0.0"
libloading = { version = "0.9.0", optional = true }
smallvec = "1.8.1"

[features]
# Enable features not ready to be enabled when compiling as part of rustc
unstable-features = ["jit", "inline_asm_sym"]
jit = ["cranelift-jit", "libloading"]
inline_asm_sym = []
unwinding = [] # Not yet included in unstable-features for performance reasons

[package.metadata.rust-analyzer]
rustc_private = true
